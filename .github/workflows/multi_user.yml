name: Multi-User Job Alerts

# Multi-tenant analog of `Automated Job Alert Scraper`. Runs the per-user
# pipeline (multi_user_runner.py) on an hourly cron and processes every user
# whose preferences.next_run_at <= NOW(). The runner itself does the gating
# — most users with the default 24h cadence will be a no-op on 23 of every
# 24 ticks.
#
# DEPLOYMENT NOTES
# ----------------
# 1. The workflow is committed with `cron` enabled but should be DISABLED in
#    the GitHub Actions UI until B10 (the 7-day dual-run) starts. Use
#    `workflow_dispatch` for ad-hoc smoke tests in the meantime.
# 2. Defaults to `--dry-run` so the first live ticks persist runs + job_results
#    into Supabase but do NOT send email. Flip the repo Variable
#    MULTI_USER_DRY_RUN to "false" when ready to actually deliver mail.
# 3. Required repo secrets (Settings → Secrets and variables → Actions):
#      SUPABASE_URL                 https://<ref>.supabase.co
#      SUPABASE_SERVICE_ROLE_KEY    server-side key from the Supabase dashboard
#      SENDER_EMAIL                 Gmail address that sends the alerts
#      EMAIL_APP_PASSWORD           Google app password for SENDER_EMAIL
#                                   (Gmail SMTP sends to any recipient; no domain)
#      (existing) GEMINI_API_KEY, GEMINI_EMBED_API_KEY, GEMINI_EMBED2_API_KEY,
#                 CEREBRAS_API_KEY, GROQ_API_KEY
#
# Unlike `Automated Job Alert Scraper`, this workflow needs NO file writes
# back to the repo: seen_jobs lives in Supabase, the feedback page is the
# Next.js dashboard, and there's no GitHub-Issue routing.

on:
  # TRIGGERING: the PRIMARY, reliable trigger is an external cron (cron-job.org)
  # that POSTs to this workflow's workflow_dispatch every 30 min — GitHub's own
  # `schedule` below is best-effort and routinely skips/delays ticks, which made
  # runs land hours late. The `schedule` is kept as a FREE BACKUP: if the
  # external service ever dies, GitHub's flaky cron still eventually fires, so we
  # degrade to "late" rather than "never". Running both is safe — the
  # `concurrency` guard + per-user next_run_at claim prevent any double-run.
  schedule:
    # Backup only (see above). Per-user cadence is enforced inside the runner via
    # preferences.next_run_at, so a daily user only sees one productive tick
    # every 24h — the other ticks are short no-op DB scans.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip email sending (overrides MULTI_USER_DRY_RUN variable)."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      user_id:
        description: "Optional: process only this user UUID (for replays / onboarding)."
        required: false
        type: string
      skip_due_check:
        description: "Optional: ignore preferences.next_run_at gating (use with user_id)."
        required: false
        type: choice
        default: "false"
        options:
          - "true"
          - "false"
      manual:
        description: "Mark as a user 'Run now' dispatch (stamps run_trigger=manual, cancels today's scheduled tick). Use with user_id."
        required: false
        type: choice
        default: "false"
        options:
          - "true"
          - "false"
      admin_override:
        description: "Admin forced run: bypass the 2/day budget cap. Use with user_id."
        required: false
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

# Shared env for ALL jobs (so the two stages don't duplicate the key list).
# Secrets resolve here once and are available to both the collect-local and the
# sharded process jobs. API accounts use their NATURAL names so the runner's
# _discover_keys finds them all (base → MULTI_ legacy → _2/_3…). To ADD an
# account: create the next secret in sequence (e.g. GEMINI_EMBED_API_KEY_3) — the
# slot below already points at it, so NO workflow edit is needed. A secret that
# doesn't exist resolves to "" and is skipped (discovery stops at the first gap,
# so keep numbering contiguous). Extra empty slots are pre-wired for headroom.
env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
  EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
  # Cerebras (account #2 historically lives in MULTI_CEREBRAS_API_KEY).
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  MULTI_CEREBRAS_API_KEY: ${{ secrets.MULTI_CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
  CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
  CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
  CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
  # Groq (fallback only — low value to scale; #2 in MULTI_GROQ_API_KEY).
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MULTI_GROQ_API_KEY: ${{ secrets.MULTI_GROQ_API_KEY }}
  GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
  GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
  # Gemini Flash Lite (lower-ranked verdicts) — rotated across accounts.
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
  GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
  # Gemini embeddings (CV + job pre-rank) — the daily-RPD bottleneck.
  GEMINI_EMBED_API_KEY: ${{ secrets.GEMINI_EMBED_API_KEY }}
  GEMINI_EMBED_API_KEY_2: ${{ secrets.GEMINI_EMBED_API_KEY_2 }}
  GEMINI_EMBED_API_KEY_3: ${{ secrets.GEMINI_EMBED_API_KEY_3 }}
  # Feedback-RAG embeddings (separate vector space) — stays single.
  GEMINI_EMBED2_API_KEY: ${{ secrets.GEMINI_EMBED2_API_KEY }}
  # Public origin of the deployed web app (repo Variable). Unset → emails just
  # omit the tokenized feedback link.
  APP_BASE_URL: ${{ vars.APP_BASE_URL }}

jobs:
  # ── Stage 1: scrape the shared Palestinian local-market jobs ONCE ──────────
  # The local market is identical for every user, so it's collected a single time
  # here and handed to the parallel shards via an artifact — they don't each
  # re-hit DDG / JobSpy / the careers Gemini extraction. The QA gate runs here and
  # gates the whole workflow (process-users `needs` this job).
  collect-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: multi-user-collect
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # ATS-detection + careers-extraction caches persist across ticks here (this
      # is the only stage that scrapes careers pages). run_id key is unique →
      # always saves; restore-keys pulls the latest prior cache.
      - name: Restore detection / extraction caches
        uses: actions/cache@v4
        with:
          path: |
            data/ats_cache.json
            data/careers_cache.json
          key: worker-data-${{ github.run_id }}
          restore-keys: |
            worker-data-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The single QA gate for the whole workflow — process-users `needs` this, so
      # a regression aborts before any user is processed.
      - name: QA gate
        run: python QA/run_all.py
      - name: Collect local-market jobs (once)
        run: python multi_user_runner.py --collect-local-only --local-jobs-file data/local_jobs.json
      - name: Upload local jobs for the shards
        uses: actions/upload-artifact@v4
        with:
          name: local-jobs
          path: data/local_jobs.json
          retention-days: 1

  # ── Stage 2: process users in PARALLEL shards ─────────────────────────────
  # Each shard handles a disjoint slice of users AND a disjoint slice of every
  # provider's accounts (see _shard_slice), so they run truly in parallel with no
  # rate-limit collisions. shard-count is the matrix size (strategy.job-total).
  # IMPORTANT: keep the matrix size ≤ the smallest provider account pool, or two
  # shards would share an account. With 2 Gemini-embed / Flash-Lite / Groq
  # accounts, 2 shards is the safe maximum today.
  process-users:
    needs: collect-local
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: multi-user-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # CV-embedding cache is used HERE (attach_similarity). Per-shard key — each
      # shard handles disjoint users, so disjoint CVs; no cross-shard collision.
      - name: Restore CV-embedding cache
        uses: actions/cache@v4
        with:
          path: data/cv_embedding.json
          key: worker-cv-${{ github.run_id }}-shard-${{ matrix.shard }}
          restore-keys: |
            worker-cv-shard-${{ matrix.shard }}-
            worker-cv-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download shared local jobs
        uses: actions/download-artifact@v4
        with:
          name: local-jobs
          path: data
      # Resolve the dispatch flags (dry-run / targeted user / manual / override).
      # Manual-dispatch input wins; else the repo Variable; else dry-run (safe).
      - name: Resolve runtime flags
        id: flags
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ -z "$DRY" ]; then
            DRY="${{ vars.MULTI_USER_DRY_RUN }}"
          fi
          if [ -z "$DRY" ]; then
            DRY="true"
          fi

          FLAGS=""
          if [ "$DRY" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.user_id }}" ]; then
            FLAGS="$FLAGS --user-id ${{ github.event.inputs.user_id }}"
          fi
          if [ "${{ github.event.inputs.skip_due_check }}" = "true" ]; then
            FLAGS="$FLAGS --skip-due-check"
          fi
          if [ "${{ github.event.inputs.manual }}" = "true" ]; then
            FLAGS="$FLAGS --manual"
          fi
          if [ "${{ github.event.inputs.admin_override }}" = "true" ]; then
            FLAGS="$FLAGS --admin-override"
          fi

          echo "Resolved flags: '$FLAGS' (dry_run=$DRY)"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"
      - name: Run shard
        run: |
          python multi_user_runner.py ${{ steps.flags.outputs.flags }} \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ strategy.job-total }} \
            --local-jobs-file data/local_jobs.json

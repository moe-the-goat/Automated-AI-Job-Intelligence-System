name: Automated Job Alert Scraper

on:
  schedule:
    # Runs at 06:55 UTC (9:55 AM Jerusalem Time)
    - cron: '55 6 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Gate the daily run on a fresh QA pass. If a subtle regression slipped
    # through code review (or a non-code change like data/reputation.json
    # broke an assumption), abort BEFORE dispatching a garbage email.
    - name: QA gate
      run: python QA/run_all.py

    - name: Restore seen-jobs + embedding-history cache
      uses: actions/cache@v4
      with:
        path: |
          seen_jobs.json
          data/embedding_history.json
        key: seen-jobs-${{ github.run_id }}
        restore-keys: seen-jobs-

    - name: Write CV from secret
      run: echo "${{ secrets.CV_TEXT }}" > cv_text.txt

    - name: Run Job Scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_EMBED_API_KEY: ${{ secrets.GEMINI_EMBED_API_KEY }}
        GEMINI_EMBED2_API_KEY: ${{ secrets.GEMINI_EMBED2_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LOGS_REPO: ${{ vars.LOGS_REPO }}
        LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
        FEEDBACK_WORKER_URL: ${{ vars.FEEDBACK_WORKER_URL }}
        FEEDBACK_PAGE_URL: https://moe-the-goat.github.io/Automated-AI-Job-Intelligence-System/feedback_global.html
        FEEDBACK_PAGE_PATH: docs/feedback_global.html
      run: |
        python scraper.py

    # Commit the freshly-rendered feedback page and any reputation list
    # updates that came from ingested block_company signals. The commit is a
    # no-op when nothing actually changed. Guard each `git add` with a file
    # existence check so a render failure (which would leave the HTML file
    # missing) doesn't fail this step — `git add <missing-file>` exits 128.
    - name: Commit feedback page and reputation updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        [ -f data/reputation.json ] && git add data/reputation.json || true
        [ -f docs/feedback_global.html ] && git add docs/feedback_global.html || true
        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Updated feedback page and reputation list from daily run"
        # Rebase-and-retry: the run is long, so the remote often moves ahead
        # (bot commits, manual pushes). A bare push then fails "fetch first" and
        # marks the job red even though the email was sent. See local_companies.yml.
        for attempt in 1 2 3; do
          if git push; then
            echo "Pushed on attempt $attempt."
            exit 0
          fi
          echo "Push rejected (attempt $attempt) — rebasing on origin/main and retrying."
          git pull --rebase origin main || true
        done
        echo "::warning::Could not push feedback-page/reputation update after 3 attempts (non-fatal)."

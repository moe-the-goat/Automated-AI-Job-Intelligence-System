name: Multi-User Feedback Digest

# Multi-tenant analog of `Feedback Digest`. Loops over every active user
# whose `preferences.last_digest_at` is older than 5 days and refreshes
# their candidate preference profile via Cerebras (with Groq fallback).
# Users already on per-job RAG retrieval (feedback_count >= threshold)
# are skipped automatically by the digest script.
#
# Required secrets (same as the single-user feedback_digest workflow plus
# Supabase):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   CEREBRAS_API_KEY, GROQ_API_KEY

on:
  schedule:
    # 07:00 UTC on the 1st, 6th, 11th, 16th, 21st, 26th — mirrors the
    # single-user digest cadence so summaries refresh on the same beat.
    - cron: '0 7 1,6,11,16,21,26 * *'
  workflow_dispatch:
    inputs:
      user_id:
        description: "Optional: digest only this user UUID."
        required: false
        type: string
      force:
        description: "Ignore the 5-day interval gate."
        required: false
        type: choice
        default: "false"
        options:
          - "true"
          - "false"

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve flags
        id: flags
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.user_id }}" ]; then
            FLAGS="$FLAGS --user-id ${{ github.event.inputs.user_id }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run multi-user digest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python feedback_digest_multi_user.py ${{ steps.flags.outputs.flags }}

name: Feedback Digest

on:
  schedule:
    # Twice a month at 07:00 UTC (1st and 15th).
    - cron: '0 7 1,15 * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feedback digest
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LOGS_REPO: ${{ vars.LOGS_REPO }}
          LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
        run: python feedback_digest.py

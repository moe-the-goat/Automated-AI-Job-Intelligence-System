name: Retention Cleanup

# Weekly housekeeping that bounds the two unbounded tables (seen_jobs +
# job_results) so the project stays inside Supabase's free 500MB tier as the
# user count grows. Bookmarked job_results are preserved indefinitely.
#
# Required secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

on:
  schedule:
    # Sundays at 04:00 UTC — a quiet window, well clear of the hourly worker.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report counts without deleting."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

concurrency:
  group: retention-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve flags
        id: flags
        run: |
          # Scheduled runs delete for real; manual dispatch defaults to a preview.
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run retention cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python cleanup_retention.py ${{ steps.flags.outputs.flags }}

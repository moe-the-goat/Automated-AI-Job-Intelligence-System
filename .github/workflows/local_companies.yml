name: Local Companies Job Scraper

on:
  schedule:
    # Runs at 08:50 UTC (11:50 AM Jerusalem Time) every day
    - cron: '50 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore seen-jobs cache
      uses: actions/cache@v4
      with:
        path: seen_jobs.json
        key: seen-jobs-${{ github.run_id }}
        restore-keys: seen-jobs-

    - name: Run Local Companies Scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LOGS_REPO: ${{ vars.LOGS_REPO }}
        LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
      run: |
        python local_companies.py

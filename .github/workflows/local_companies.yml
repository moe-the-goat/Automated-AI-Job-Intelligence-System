name: Local Companies Job Scraper

on:
  schedule:
    # Runs at 08:50 UTC (11:50 AM Jerusalem Time) every day
    - cron: '50 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape-local:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Gate the daily run on a fresh QA pass. If a subtle regression slipped
    # through code review (or a non-code change like the IT Companies xlsx
    # broke an assumption), abort BEFORE dispatching a garbage email.
    - name: QA gate
      run: python QA/run_all.py

    - name: Restore seen-jobs + embedding-history cache
      uses: actions/cache@v4
      with:
        path: |
          seen_jobs.json
          data/embedding_history.json
        key: seen-jobs-${{ github.run_id }}
        restore-keys: seen-jobs-

    - name: Write CV from secret
      run: echo "${{ secrets.CV_TEXT }}" > cv_text.txt

    - name: Run Local Companies Scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_EMBED_API_KEY: ${{ secrets.GEMINI_EMBED_API_KEY }}
        GEMINI_EMBED2_API_KEY: ${{ secrets.GEMINI_EMBED2_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Option A: official Google Programmable Search (reliable, not IP-blocked)
        # for LinkedIn-post + careers discovery. When unset, the pipeline falls
        # back to DuckDuckGo automatically — so this is safe to add before the
        # secrets exist.
        GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
        GOOGLE_SEARCH_CX: ${{ vars.GOOGLE_SEARCH_CX }}
        LOGS_REPO: ${{ vars.LOGS_REPO }}
        LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
        FEEDBACK_WORKER_URL: ${{ vars.FEEDBACK_WORKER_URL }}
        FEEDBACK_PAGE_URL: https://moe-the-goat.github.io/Automated-AI-Job-Intelligence-System/feedback_local.html
        FEEDBACK_PAGE_PATH: docs/feedback_local.html
      run: |
        python local_companies.py

    # Commit the freshly-rendered feedback page and any reputation list
    # updates that came from ingested block_company signals.
    - name: Commit feedback page and reputation updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        [ -f data/reputation.json ] && git add data/reputation.json || true
        [ -f docs/feedback_local.html ] && git add docs/feedback_local.html || true
        # Nothing changed? Done.
        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "Updated local feedback page and reputation list from daily run"
        # The run takes ~20-75 min, during which the remote often moves ahead
        # (daily bot commits, manual pushes). A bare `git push` then fails with
        # "fetch first" and marks the whole job red even though the pipeline
        # succeeded and the email was sent. Rebase onto the latest remote and
        # retry a few times so a concurrent push doesn't fail the run.
        for attempt in 1 2 3; do
          if git push; then
            echo "Pushed on attempt $attempt."
            exit 0
          fi
          echo "Push rejected (attempt $attempt) — rebasing on origin/main and retrying."
          git pull --rebase origin main || true
        done
        echo "::warning::Could not push feedback-page/reputation update after 3 attempts (non-fatal)."

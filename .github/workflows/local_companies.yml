name: Local Companies Job Scraper

on:
  schedule:
    # Runs at 08:50 UTC (11:50 AM Jerusalem Time) every day
    - cron: '50 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  scrape-local:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: write
      issues: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Gate the daily run on a fresh QA pass. If a subtle regression slipped
    # through code review (or a non-code change like the IT Companies xlsx
    # broke an assumption), abort BEFORE dispatching a garbage email.
    - name: QA gate
      run: python QA/run_all.py

    - name: Restore seen-jobs + embedding-history cache
      uses: actions/cache@v4
      with:
        path: |
          seen_jobs.json
          data/embedding_history.json
        key: seen-jobs-${{ github.run_id }}
        restore-keys: seen-jobs-

    - name: Write CV from secret
      run: echo "${{ secrets.CV_TEXT }}" > cv_text.txt

    - name: Run Local Companies Scraper
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LOGS_REPO: ${{ vars.LOGS_REPO }}
        LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
        FEEDBACK_WORKER_URL: ${{ vars.FEEDBACK_WORKER_URL }}
        FEEDBACK_PAGE_URL: https://moe-the-goat.github.io/Automated-AI-Job-Intelligence-System/feedback_local.html
        FEEDBACK_PAGE_PATH: docs/feedback_local.html
      run: |
        python local_companies.py

    # Commit the freshly-rendered feedback page and any reputation list
    # updates that came from ingested block_company signals.
    - name: Commit feedback page and reputation updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/feedback_local.html data/reputation.json
        git diff --staged --quiet || git commit -m "Updated local feedback page and reputation list from daily run"
        git push

name: Migrate User Data (B9a)

# One-shot, manually-triggered migration of a user's legacy single-user
# corpus (feedback log + embeddings + candidate preferences) and the global
# reputation list into Supabase. Runs migrate_to_multi_user.py using the
# repo's existing secrets, so there's nothing to copy locally — in
# particular it avoids needing the LOGS_REPO_TOKEN value, which GitHub only
# shows once at PAT creation.
#
# Idempotent: safe to re-run. Defaults to --dry-run; flip the input to
# actually write.
#
# Required secrets (already configured for the other workflows):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, LOGS_REPO_TOKEN
# Required variable:
#   LOGS_REPO  (e.g. moe-the-goat/job-scrapper-logs)

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: "Target user UUID (takes precedence over email)."
        required: false
        type: string
      email:
        description: "Target user email (looked up via the auth admin API)."
        required: false
        type: string
      dry_run:
        description: "Preview only — read everything, write nothing."
        required: false
        type: choice
        default: "true"
        options:
          - "true"
          - "false"

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: QA gate
        run: python QA/run_all.py

      - name: Resolve flags
        id: flags
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.user_id }}" ]; then
            FLAGS="--user-id ${{ github.event.inputs.user_id }}"
          elif [ -n "${{ github.event.inputs.email }}" ]; then
            FLAGS="--email ${{ github.event.inputs.email }}"
          else
            echo "::error::Provide either user_id or email."
            exit 1
          fi
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "Resolved flags: $FLAGS"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run data migration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOGS_REPO: ${{ vars.LOGS_REPO }}
          LOGS_REPO_TOKEN: ${{ secrets.LOGS_REPO_TOKEN }}
          # Optional: lets the run backfill any feedback embeddings missing from
          # the logs-repo snapshot. Falls back cleanly when unset.
          GEMINI_EMBED2_API_KEY: ${{ secrets.GEMINI_EMBED2_API_KEY }}
          GEMINI_EMBED_API_KEY: ${{ secrets.GEMINI_EMBED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python migrate_to_multi_user.py ${{ steps.flags.outputs.flags }}
